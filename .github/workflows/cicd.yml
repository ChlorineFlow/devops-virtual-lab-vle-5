name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-virtual-lab:${{ github.sha }} ./app

      - name: Load image into Minikube
        run: |
          docker tag devops-virtual-lab:${{ github.sha }} devops-virtual-lab:latest
          minikube image load devops-virtual-lab:latest

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f k8s/deployment.yml
          kubectl apply -f k8s/service.yml
          kubectl rollout status deployment/devops-app --timeout=120s

      - name: Verify deployment
        run: |
          kubectl get pods
          kubectl get service devops-service
